; Space Ships — PlatformIO config
; Board settings: https://docs.platformio.org/en/latest/boards/atmelmegaavr/nano_every.html

[platformio]
default_envs = mw_space_two_simple_ships

; Shared by every env, so board settings live in one place
[env]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
; upload_port not set: PlatformIO auto-detects. Set it only with 2+ boards plugged in.

; Live display firmware
[env:mw_space_two_simple_ships]
build_src_filter = +<*> -<bench_test.cpp>

; Bench test: serial menu for relay polarity, limit NO/NC, and travel timing
[env:bench_test]
build_src_filter = +<bench_test.cpp>
